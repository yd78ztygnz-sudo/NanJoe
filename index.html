<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>For Joe, Always Been You ♡</title><style>body{margin:0;min-height:100vh;font-family:Georgia,serif;color:#4b3035;background:#fff8f8;display:flex;justify-content:center;align-items:center;padding:24px 14px}.page{width:min(760px,100%);text-align:center}.heart{font-size:30px;color:#d86b7c}h1{font-size:clamp(30px,7vw,52px);font-weight:500;margin:4px 0}.date,.small{font-family:Arial,sans-serif;color:#8a666d;font-size:13px}.date{margin-bottom:18px}.card{background:#fff;border:1px solid #f1dce0;border-radius:26px;padding:12px 12px 24px;box-shadow:0 18px 55px #64323c20}.photo-wrap{overflow:hidden;border-radius:19px;background:#eee;aspect-ratio:4/3}.photo{width:100%;height:100%;object-fit:cover;display:block}.message{padding:22px 10px 0;font-size:clamp(20px,4.5vw,28px);line-height:1.45}.song{margin-top:18px;color:#d86b7c;font-family:Arial,sans-serif;font-weight:600}.song a{color:inherit;text-decoration:none}.song a:hover{text-decoration:underline}.small{margin-top:10px}.dots{display:flex;justify-content:center;gap:7px;margin-top:16px}.dot{width:6px;height:6px;border-radius:50%;background:#e9c4cb}.dot.active{background:#d86b7c;transform:scale(1.35)}</style></head>
<body><main class="page"><div class="heart">♡</div><h1>For Joe, Always Been You ♡</h1><div class="date" id="date"></div><section class="card"><div class="photo-wrap"><img id="photo" class="photo" alt="A photo of us"></div><div class="message" id="message"></div><div class="song"><a href="https://www.youtube.com/watch?v=jr4C2ea0Ymg&list=RDjr4C2ea0Ymg&start_radio=1" target="_blank" rel="noopener">♫ Always Been You</a></div><div class="small">A little reminder, just for you ♡</div><div class="dots" id="dots"></div></section></main><script>const photos=['couple-1.jpg','couple-2.jpg','couple-3.jpg','couple-4.jpg','couple-5.jpg','couple-6.jpg','couple-7.jpg'];const messages=['Joe, I love you more than words can say. Have a beautiful day, my love. ♡','Just a little reminder for Joe: you are loved, you are precious, and you make my days brighter. Have a wonderful day. ♡','No matter how busy today gets, I hope you remember that someone is always cheering for you. I love you, Joe. ♡','Good morning, Joe. May today bring you lots of smiles, peaceful moments, and little reasons to be happy. ♡','I hope your day is as lovely as the memories we make together. Take care and have a really good day, Joe. ♡','Sending you a little love for today, Joe. Keep smiling, keep shining, and remember that I love you. ♡','Whatever today brings, I hope it treats you kindly. Have a wonderful day, sweetheart. I’ll be thinking of you, Joe. ♡'];const now=new Date();const start=new Date(now.getFullYear(),0,0);const index=(Math.floor((now-start)/86400000)-1)%photos.length;document.getElementById('photo').src=photos[index];document.getElementById('message').textContent=messages[index];document.getElementById('date').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});photos.forEach((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===index?' active':'');document.getElementById('dots').appendChild(d)});</script></body></html>
