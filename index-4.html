const messages = ["I love you, today and every day. I hope you have a beautiful day. ❤️","Just a little reminder: you are deeply loved. Have the loveliest day, my love. 🤍","Wherever today takes you, I hope it brings you lots of smiles. I love you. 🌷","You make my ordinary days feel special. I hope today is kind to you. 💕","I’m always cheering for you. Have a wonderful day, my love. ☀️","Thank you for being my favorite person. I love you more than words can say. 💗","May your day be peaceful, happy, and full of little moments that make you smile. Love you. 🌸","One more day to love you, and I’m grateful for every single one. Have a great day! 🫶","Whatever happens today, remember that someone is always thinking of you. Me. ❤️","You are my happy place. I hope today gives you a hundred reasons to smile. 😊","I hope today treats you gently and brings you everything you need. I love you. 🤍","Sending you a little love to start your day. Go make today a good one, my love. 🌤️","Life is sweeter with you in it. Have a beautiful day, and know that I love you. 💞","Just in case you forgot: you are my favorite. Have an amazing day! 💘","I’m so lucky I get to love you. Wishing you a warm, happy, wonderful day. 🌼","No matter how busy today gets, don’t forget to smile. I love you always. 🥰","Today is another day I get to choose you. I hope you have the best day. ❤️","You and me, one day at a time. I love our little story. Have a lovely day. 🌿","Here’s your daily dose of love from me. I hope your day is as wonderful as you are. 💕"];

// Bangkok time keeps the photo the same for the whole day in Thailand.
const parts = new Intl.DateTimeFormat("en-CA", {
  timeZone:"Asia/Bangkok", year:"numeric", month:"2-digit", day:"2-digit"
}).formatToParts(new Date());
const y = parts.find(x=>x.type==="year").value;
const m = parts.find(x=>x.type==="month").value;
const d = parts.find(x=>x.type==="day").value;
const dateKey = `${y}-${m}-${d}`;

function hash(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
const index = hash(dateKey) % photos.length;
document.getElementById("photo").src = photos[index];
document.getElementById("message").textContent = messages[index % messages.length];

const pretty = new Intl.DateTimeFormat("en-US", {
  timeZone:"Asia/Bangkok", weekday:"long", month:"long", day:"numeric", year:"numeric"
}).format(new Date());
document.getElementById("date").textContent = pretty;
</script>
